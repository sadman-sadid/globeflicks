<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EBook Hub - Free Digital Library</title>
    <style>
        /* CSS Reset & Variables */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        :root {
            --bg-color: #0a0a0a;
            --text-color: #ffffff;
            --text-muted: #888888;
            --border-color: #222222;
            --hover-bg: #ffffff;
            --hover-text: #000000;
            --ad-bg: #111111;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding-bottom: 70px; /* Space for bottom ad bar */
        }

        /* Navbar */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2rem 5%;
            border-bottom: 1px solid var(--border-color);
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.3s ease;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: var(--text-color);
        }

        /* Ad Slots Styling */
        .ad-space {
            background-color: var(--ad-bg);
            border: 1px dashed #333333;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #555555;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            overflow: hidden;
        }

        /* Header Leaderboard Ad (Top) */
        .ad-top {
            max-width: 1200px;
            width: 100%;
            height: 90px;
            margin: 1.5rem auto 0 auto;
        }

        /* Fixed Bottom Anchor Ad */
        .ad-bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background-color: #000000;
            border-top: 1px solid var(--border-color);
            z-index: 99;
        }

        /* Hero Section */
        .hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem 1.5rem;
        }

        .hero h1 {
            font-size: clamp(2.5rem, 6vw, 4.5rem);
            font-weight: 800;
            letter-spacing: -1px;
            line-height: 1.1;
            margin-bottom: 1.5rem;
            max-width: 800px;
        }

        .hero p {
            font-size: clamp(1rem, 2vw, 1.2rem);
            color: var(--text-muted);
            margin-bottom: 2.5rem;
            max-width: 500px;
            line-height: 1.6;
        }

        .btn-browse {
            display: inline-block;
            padding: 1rem 2.5rem;
            background-color: transparent;
            color: var(--text-color);
            border: 1px solid var(--text-color);
            text-decoration: none;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-browse:hover {
            background-color: var(--hover-bg);
            color: var(--hover-text);
        }
    </style>
    <meta name="monetag" content="9caca046b7b08ce05a7502abc1e086c4">
</head>
<body>

    <!-- Navigation Bar -->
    <nav>
        <div class="logo">EBOOK HUB</div>
        <ul class="nav-links">
            <li><a href="index.html" class="active">Home</a></li>
            <li><a href="books.html">Books</a></li>
        </ul>
    </nav>

    <!-- Top Banner Ad Slot -->
    <div class="ad-space ad-top">
        <span><!-- Put AdSense or Banner Code Here (728x90) --> Advertisement Space</span>
    </div>

    <!-- Hero Section -->
    <section class="hero">
        <h1>Free Digital Library for Everyone</h1>
        <p>Discover and download high-quality ebooks across various categories completely for free.</p>
        <a href="books.html" class="btn-browse">Browse Books</a>
    </section>

    <!-- Sticky Bottom Ad Bar Slot -->
    <div class="ad-space ad-bottom-bar">
        <span><!-- Sticky Footer Ad Code Here --> Sticky Footer Advertisement</span>
    </div>

</body>
</html>
