<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLOBEFLICKS</title>
    <link rel="icon" type="image/png" sizes="32x32" href="GLOBEFLICKS.png">
    <style>
        /* CSS Reset & Variables */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        :root {
            --bg-color: #0a0a0a;
            --text-color: #ffffff;
            --text-muted: #888888;
            --border-color: #222222;
            --hover-bg: #ffffff;
            --hover-text: #000000;
            --ad-bg: #111111;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding-bottom: 70px; /* Space for bottom ad bar */
        }

        /* Navbar */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 5%;
            border-bottom: 1px solid var(--border-color);
            position: relative;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            z-index: 101;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.3s ease;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: var(--text-color);
        }

        /* Mobile Menu Toggle Button */
        .menu-toggle {
            display: none;
            flex-direction: column;
            justify-content: space-between;
            width: 25px;
            height: 18px;
            background: transparent;
            border: none;
            cursor: pointer;
            z-index: 101;
            padding: 0;
        }

        .menu-toggle span {
            width: 100%;
            height: 2px;
            background-color: var(--text-color);
            transition: all 0.3s ease;
        }

        /* Ad Slots Styling */
        .ad-space {
            background-color: var(--ad-bg);
            border: 1px dashed #333333;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #555555;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            overflow: hidden;
            text-align: center;
            padding: 0.5rem;
        }

        /* Header Leaderboard Ad (Top) */
        .ad-top {
            max-width: 1200px;
            width: 90%;
            height: 90px;
            margin: 1.5rem auto 0 auto;
        }

        /* Fixed Bottom Anchor Ad */
        .ad-bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background-color: #000000;
            border-top: 1px solid var(--border-color);
            z-index: 99;
        }

        /* Hero Section */
        .hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 3rem 1.5rem;
        }

        .hero h1 {
            font-size: clamp(2.2rem, 6vw, 4.5rem);
            font-weight: 800;
            letter-spacing: -1px;
            line-height: 1.1;
            margin-bottom: 1.5rem;
            max-width: 800px;
        }

        .hero p {
            font-size: clamp(0.95rem, 2vw, 1.2rem);
            color: var(--text-muted);
            margin-bottom: 2.5rem;
            max-width: 500px;
            line-height: 1.6;
        }

        /* Button group (holds buttons side by side) */
        .btn-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1rem;
            width: 100%;
            max-width: 500px;
        }

        .btn-browse {
            display: inline-block;
            padding: 1rem 2.5rem;
            background-color: transparent;
            color: var(--text-color);
            border: 1px solid var(--text-color);
            text-decoration: none;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
            transition: all 0.3s ease;
            text-align: center;
        }

        .btn-browse:hover {
            background-color: var(--hover-bg);
            color: var(--hover-text);
        }

        /* Responsive Breakpoints */
        @media (max-width: 768px) {
            .menu-toggle {
                display: flex;
            }

            .nav-links {
                position: fixed;
                top: 0;
                right: -100%;
                width: 100%;
                height: 100vh;
                background-color: var(--bg-color);
                flex-direction: column;
                justify-content: center;
                align-items: center;
                gap: 2.5rem;
                transition: right 0.3s ease;
                z-index: 100;
            }

            .nav-links.active {
                right: 0;
            }

            .nav-links a {
                font-size: 1.2rem;
            }

            .ad-top {
                height: 60px; /* Responsive ad height for tablets/mobile */
                margin-top: 1rem;
            }

            .hero {
                padding: 2rem 1rem;
            }

            .btn-group {
                flex-direction: column;
            }

            .btn-browse {
                width: 100%;
            }
        }

        @media (max-width: 480px) {
            .logo {
                font-size: 1.1rem;
            }

            .ad-top {
                font-size: 0.7rem;
                height: 50px;
            }

            .ad-bottom-bar {
                font-size: 0.75rem;
                height: 50px;
            }

            body {
                padding-bottom: 60px;
            }
        }
    </style>
</head>
<body>

    <!-- Navigation Bar -->
    <nav>
        <div class="logo">GLOBEFLICKS</div>
        
        <button class="menu-toggle" id="mobile-menu-btn" aria-label="Toggle Navigation Menu">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <ul class="nav-links" id="nav-links">
            <li><a href="index.html" class="active">Home</a></li>
            <li><a href="books.html">Books</a></li>
        </ul>
    </nav>

    <!-- Top Banner Ad Slot -->
    <div class="ad-space ad-top">
        <span><!-- Put AdSense or Banner Code Here (728x90) --> Advertisement Space</span>
    </div>

    <!-- Hero Section -->
    <section class="hero">
        <h1>Free E-Books & Templates</h1>
        <p>Discover and download high-quality E-books completely for free.</p>
        <div class="btn-group">
            <a href="books.html" class="btn-browse">Browse Books</a>
            <a href="templates.html" class="btn-browse">Browse Templates</a>
        </div>
    </section>

    <!-- Sticky Bottom Ad Bar Slot -->
    <div class="ad-space ad-bottom-bar">
        <span><!-- Sticky Footer Ad Code Here --> Sticky Footer Advertisement</span>
    </div>

    <!-- Mobile Navigation Toggle Script -->
    <script>
        const menuBtn = document.getElementById('mobile-menu-btn');
        const navLinks = document.getElementById('nav-links');

        menuBtn.addEventListener('click', () => {
            navLinks.classList.toggle('active');
        });
    </script>
</body>
</html>
